name: bdtuition_app
description: "BDTuition Teacher App - Official Android App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0

  # State Management
  provider: ^6.1.1

  # Local Storage
  shared_preferences: ^2.2.2

  # Image Picker (for registration)
  image_picker: ^1.0.7

  # URL Launcher
  url_launcher: ^6.2.4

  # WebView (for bKash payment)
  webview_flutter: ^4.5.0

  # Cached Network Image
  cached_network_image: ^3.3.1

  # Flutter Icons
  cupertino_icons: ^1.0.8

  # Intl for formatting
  intl: ^0.19.0

  # Location / GPS (Demo Check-In)
  geolocator: ^11.0.0

  # Device security checks (mock GPS / root / dev mode detection)
  safe_device: ^1.1.4

  # Push notifications (system tray when app is closed) — Feature 5 offline half.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates Android launcher icons from assets/logo.png (replaces the
  # default Flutter logo). Run: flutter pub run flutter_launcher_icons
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

# App launcher icon configuration. Uses the BDTuition logo for the Android
# home-screen icon across all densities, with a white background for the
# adaptive (round) icon so the logo stays visible on any launcher.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
